
plugins {
    id 'java-library'
    id 'jacoco'
    id 'checkstyle'
    id "io.freefair.lombok" version "9.5.0"
}

group = 'uk.gov.justice.laa.claimforpayment.authx'

checkstyle {
    toolVersion = rootProject.ext.checkstyleVersion
}

dependencies {
    checkstyle "com.puppycrawl.tools:checkstyle:${rootProject.ext.checkstyleVersion}"
}

repositories {
    mavenCentral()
}


test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    //     testLogging {
    //     events "passed", "skipped", "failed", "standard_out", "standard_error"
    //     showStandardStreams = true
    // }
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn compileJava
    dependsOn processResources
    
    shouldRunAfter jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it)
        }))
    }
}

dependencies {

    
    api platform("org.springframework.security:spring-security-bom:7.1.1")
    api platform("org.springframework:spring-framework-bom:7.0.9")

    api "org.springframework.security:spring-security-core"
    api "org.springframework.security:spring-security-oauth2-jose"
    api "org.springframework.security:spring-security-oauth2-resource-server"

    compileOnly "org.springframework:spring-web"
    implementation "jakarta.servlet:jakarta.servlet-api:6.1.0"
    implementation 'org.slf4j:slf4j-api:2.0.19'
    implementation 'org.json:json:20260814'

    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.springframework:spring-test"

    testImplementation "com.nimbusds:nimbus-jose-jwt"

    testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "org.assertj:assertj-core:3.27.7"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    runtimeOnly "ch.qos.logback:logback-classic:1.6.3"
}
