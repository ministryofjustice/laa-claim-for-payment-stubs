pluginManagement {
    repositories {
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
        gradlePluginPortal()
    }

    plugins {
        id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.0.3' apply false
        id 'org.openapi.generator' version '7.25.0'
        id 'io.freefair.lombok' version '9.5.0'
    }
}

rootProject.name = 'laa-claim-for-payment-stubs'

include 'stub-civil-claims-api'
include 'stub-oidc-server'
include 'authx-secondary'
include 'stub-access-datastore-api'
include 'stub-provider-details-api'
// include 'spring-boot-microservice-service'