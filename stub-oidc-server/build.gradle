plugins {
    id 'io.freefair.lombok'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    // testLogging {
    //     events "passed", "skipped", "failed", "standard_out", "standard_error"
    //     showStandardStreams = true
    // }
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/MockOidcApplication.class'
            ])
        }))

        executionData fileTree(dir: "$buildDir/jacoco", includes: [
            "test.exec",
            "integrationTest.exec"
        ])
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/MockOidcApplication.class'
            ])
        }))

        executionData fileTree(dir: "$buildDir/jacoco", includes: [
            "test.exec",
            "integrationTest.exec"
        ])
    }
}

sourceSets {
  main {
    java {
      srcDirs = ['src/main/java', 'generated/src/main/java']
    }
  }
}

tasks.named('checkstyleMain') {
  source = fileTree('src/main/java')
}

dependencies {
  checkstyle "com.puppycrawl.tools:checkstyle:${rootProject.ext.checkstyleVersion}"

  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.security:spring-security-oauth2-authorization-server'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server' // /userinfo reads JWT
  implementation 'commons-logging:commons-logging:1.4.0'
  implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.24'
  implementation 'org.postgresql:postgresql:42.7.13'
  implementation "tools.jackson.core:jackson-databind:${rootProject.ext.jacksonDatabindVersion}"

  // Overrides to resolve vulnerabilities identified by Snyk
  implementation 'ch.qos.logback:logback-core:1.6.1'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
  testImplementation "org.springframework.security:spring-security-test"

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  runtimeOnly "ch.qos.logback:logback-classic:1.6.1"
  runtimeOnly "ch.qos.logback:logback-core:1.6.1"
}
