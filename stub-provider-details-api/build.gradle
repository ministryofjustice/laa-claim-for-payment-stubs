plugins {
    id 'io.freefair.lombok'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    // testLogging {
    //     events "passed", "skipped", "failed", "standard_out", "standard_error"
    //     showStandardStreams = true
    // }
}

integrationTest {
    // testLogging {
    //     events "passed", "skipped", "failed", "standard_out", "standard_error"
    //     showStandardStreams = true
    // }
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/ProviderDetailsStubApplication.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/ProviderDetailsStubApplication.class'])
        }))
    }
}

dependencies {
    checkstyle "com.puppycrawl.tools:checkstyle:${rootProject.ext.checkstyleVersion}"

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'tools.jackson.core', module: 'jackson-databind'
        exclude group: 'tools.jackson.core', module: 'jackson-core'
    }
    implementation('org.springframework.boot:spring-boot-starter-webmvc') {
        exclude group: 'tools.jackson.core', module: 'jackson-databind'
        exclude group: 'tools.jackson.core', module: 'jackson-core'
    }
    implementation "tools.jackson.core:jackson-core:${rootProject.ext.jacksonDatabindVersion}"
    implementation "tools.jackson.core:jackson-databind:${rootProject.ext.jacksonDatabindVersion}"
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.wiremock:wiremock-standalone:3.13.2'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.24'

    runtimeOnly "ch.qos.logback:logback-classic:1.6.3"
    runtimeOnly "ch.qos.logback:logback-core:1.6.3"

    // Overrides to resolve vulnerabilities identified by Snyk
    implementation 'ch.qos.logback:logback-core:1.6.3'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-logging'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}
